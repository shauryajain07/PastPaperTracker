name: PastPaperTracker
options:
  bundleIdPrefix: com.shauryajain
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0
settings:
  base:
    PRODUCT_NAME: PastPaperTracker
    SWIFT_VERSION: 6.0
    TARGETED_DEVICE_FAMILY: 1
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Past Paper Tracker
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Attach a photo to a mistake entry.
    INFOPLIST_KEY_NSCameraUsageDescription: Capture a photo for a mistake entry.
targets:
  PastPaperTracker:
    type: application
    platform: iOS
    sources:
      - path: PastPaperTracker
        excludes:
          - Resources/SupabaseConfig.plist.example
    resources:
      - path: PastPaperTracker/Resources
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shauryajain.PastPaperTracker
        INFOPLIST_KEY_CFBundleURLTypes:
          - CFBundleURLName: com.shauryajain.PastPaperTracker
            CFBundleURLSchemes:
              - pastpapertracker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - PastPaperTrackerTests
        - PastPaperTrackerUITests
  PastPaperTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PastPaperTrackerTests
    dependencies:
      - target: PastPaperTracker
    settings:
      base:
        PRODUCT_NAME: $(TARGET_NAME)
        SWIFT_MODULE_NAME: $(TARGET_NAME)
  PastPaperTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PastPaperTrackerUITests
    dependencies:
      - target: PastPaperTracker
    settings:
      base:
        PRODUCT_NAME: $(TARGET_NAME)
        SWIFT_MODULE_NAME: $(TARGET_NAME)
